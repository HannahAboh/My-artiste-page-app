<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set your password · My Artiste Page</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f2ece2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%2712%27 fill=%27%231e1814%27/%3E%3Cpath fill=%27%23f2ece2%27 d=%27M10 6v7.1A2.6 2.6 0 1 0 11.4 15.4V9l5-1.2v3.9a2.6 2.6 0 1 0 1.4 2.3V4.6Z%27/%3E%3C/svg%3E">

</head>
<body>
<div class="shapes" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="top"><div class="wrap"><a class="brand" href="/"><b><svg viewBox="0 0 24 24"><path d="M10 6v7.1A2.6 2.6 0 1 0 11.4 15.4V9l5-1.2v3.9a2.6 2.6 0 1 0 1.4 2.3V4.6Z"/></svg></b>My Artiste Page</a><nav><a class="btn line small" href="/login">Sign in</a></nav></div></header>
<main class="solo">
<form class="card glass reveal" id="f" novalidate>
  <div class="label">Step 3 of 3 · Your login</div>
  <h1 class="title">Set your<br>password</h1>
  <div class="form">
    <label class="field"><span>New password</span><input name="pw" type="password" autocomplete="new-password" minlength="8" required><small>At least 8 characters.</small></label>
    <label class="field"><span>Type it again</span><input name="pw2" type="password" autocomplete="new-password" required></label>
    <div class="msg" id="msg" role="alert" hidden></div>
    <button class="btn wide" id="go">Save and continue</button>
  </div>
  <p class="alt">Link not working? <a href="/login?forgot=1">Send a new one</a></p>
</form>
</main>
<script type="module">
import { $, api, busy, showMsg, setPasswordWithLink, homeFor, reveals } from "/assets/app.js";
reveals();
const q = new URLSearchParams(location.search), f = $("#f"), msg = $("#msg");
const type = q.get("type") === "recovery" ? "recovery" : "invite", token = q.get("token");
if (type === "recovery") $(".label").textContent = "Your login";
if (!token) showMsg(msg, "This page needs the link from your email. Open the email and tap the button again.");
f.addEventListener("submit", async e => {
  e.preventDefault();
  showMsg(msg, "");
  if (f.pw.value.length < 8) return showMsg(msg, "Please use at least 8 characters."), f.pw.focus();
  if (f.pw.value !== f.pw2.value) return showMsg(msg, "The two passwords don't match."), f.pw2.focus();
  const btn = $("#go");
  busy(btn, true);
  try {
    await setPasswordWithLink(type, token, f.pw.value);
    const me = await api("/api/me", { signedIn: true });
    location.href = await homeFor(me);
  } catch (err) { busy(btn, false); showMsg(msg, err.message); }
});
</script>
</body>
</html>
