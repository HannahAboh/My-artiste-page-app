<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join · My Artiste Page</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f2ece2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%2712%27 fill=%27%231e1814%27/%3E%3Cpath fill=%27%23f2ece2%27 d=%27M10 6v7.1A2.6 2.6 0 1 0 11.4 15.4V9l5-1.2v3.9a2.6 2.6 0 1 0 1.4 2.3V4.6Z%27/%3E%3C/svg%3E">

</head>
<body>
<div class="shapes" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="top"><div class="wrap"><a class="brand" href="/"><b><svg viewBox="0 0 24 24"><path d="M10 6v7.1A2.6 2.6 0 1 0 11.4 15.4V9l5-1.2v3.9a2.6 2.6 0 1 0 1.4 2.3V4.6Z"/></svg></b>My Artiste Page</a><nav><a class="btn line small" href="/login">Sign in</a></nav></div></header>
<main class="solo">
<form class="card glass reveal" id="f" novalidate>
  <div class="label" id="kicker">Step 1 of 3 · Your plan</div>
  <h1 class="title">Let's get<br>you live</h1>
  <div class="form">
    <div class="switch" role="radiogroup" aria-label="Plan">
      <label><input type="radio" name="plan" value="monthly" checked><span>Monthly<em data-price="monthly">$5 / month</em></span></label>
      <label><input type="radio" name="plan" value="yearly"><span>Yearly<em data-price="yearly">$50 / year</em></span></label>
    </div>
    <label class="field"><span>Your name</span><input name="fullName" autocomplete="name" required maxlength="80" placeholder="Ada Okafor"></label>
    <label class="field"><span>Artist or podcast name</span><input name="artistName" autocomplete="organization" maxlength="80" placeholder="Ada"></label>
    <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" inputmode="email" required placeholder="you@example.com"><small>We'll send your login link here.</small></label>
    <div class="msg" id="msg" role="alert" hidden></div>
    <button class="btn wide" id="go">Continue to payment</button>
    <p class="muted" style="font-size:13px;margin:0;text-align:center">You'll pay on Paystack's secure page. Renews automatically, cancel any time.</p>
  </div>
  <p class="alt">Already have an account? <a href="/login">Sign in</a></p>
</form>
</main>
<script type="module">
import { $, config, money, api, busy, showMsg, reveals } from "/assets/app.js";
reveals();
const f = $("#f"), q = new URLSearchParams(location.search);
if (q.get("plan") === "yearly") f.plan.value = "yearly";
if (q.get("email")) f.email.value = q.get("email");
if (q.get("renew")) { $("#kicker").textContent = "Keep your page live"; $(".title").innerHTML = "Pay and<br>carry on"; }
config().then(c => {
  for (const k of ["monthly", "yearly"]) $(`[data-price="${k}"]`).textContent = `${money(c.prices[k])} / ${k === "monthly" ? "month" : "year"}`;
}).catch(() => {});
f.addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#go"), msg = $("#msg");
  showMsg(msg, "");
  if (!f.fullName.value.trim() && !q.get("renew")) return showMsg(msg, "Please add your name."), f.fullName.focus();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.value.trim())) return showMsg(msg, "Please check your email address."), f.email.focus();
  busy(btn, true);
  try {
    const r = await api("/api/checkout", { method: "POST", body: { plan: f.plan.value, fullName: f.fullName.value, artistName: f.artistName.value, email: f.email.value } });
    location.href = r.url;
  } catch (err) {
    busy(btn, false);
    showMsg(msg, err.message);
    if (err.data?.signIn) msg.insertAdjacentHTML("beforeend", ' <a href="/login">Sign in</a>');
  }
});
</script>
</body>
</html>
